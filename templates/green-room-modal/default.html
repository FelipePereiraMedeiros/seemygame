<div id="green-room-modal" class="modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="green-room-title">
    <div class="modal-content green-room-modal-content">
      <div class="green-room-badge">
        <span>🎮</span> Sala Pronta
      </div>
      <h3 id="green-room-title" class="green-room-title">Pronto para entrar?</h3>
      <p class="green-room-subtitle">
        Você está entrando na sala <strong id="green-room-id-label" style="color: var(--accent-cyan);">#geral</strong>
      </p>

      <div class="green-room-audio-preview">
        <div class="green-room-mic-header">
          <span class="green-room-mic-label">
            <span>🎙️</span> Teste de Microfone
          </span>
          <button id="green-room-toggle-mic-btn" class="green-room-toggle-mic-btn" type="button">
            <span id="green-room-mic-icon">🔊</span> <span id="green-room-mic-btn-text">Microfone Ativo</span>
          </button>
        </div>

        <div class="vu-meter-bar-container">
          <div id="green-room-vu-bar" class="vu-meter-bar-fill"></div>
        </div>

        <div id="green-room-mic-status" style="font-size: 11.5px; color: var(--text-muted);">
          Fale algo para verificar se o seu microfone está captando som...
        </div>

        <!-- Seleção de Dispositivos de Áudio -->
        <div class="green-room-device-group" style="margin-top: 6px; display: flex; flex-direction: column; gap: 10px;">
          <div class="green-room-device-field">
            <label for="green-room-mic-select" class="green-room-device-label">
              <span>🎙️</span> Microfone (Entrada):
            </label>
            <select id="green-room-mic-select" class="custom-id-field green-room-select" style="width: 100%;"></select>
          </div>

          <div class="green-room-device-field">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
              <label for="green-room-speaker-select" class="green-room-device-label" style="margin: 0;">
                <span>🎧</span> Saída de Som (Alto-falante / Fone):
              </label>
              <button id="green-room-test-speaker-btn" class="green-room-test-btn" type="button" title="Ouvir som de teste">
                <span>🔊</span> Testar Som
              </button>
            </div>
            <select id="green-room-speaker-select" class="custom-id-field green-room-select" style="width: 100%;"></select>
            <div id="green-room-speaker-note" class="green-room-device-hint"></div>
          </div>
        </div>
      </div>

      <div style="margin-bottom: 20px; text-align: left;">
        <label for="green-room-user-name" style="display: block; font-size: 12.5px; color: var(--text-muted); margin-bottom: 6px;">Seu Apelido na Sala:</label>
        <input
          type="text"
          id="green-room-user-name"
          class="custom-id-field"
          placeholder="Ex: Diogo, Shadow, Gamer123"
          maxlength="24"
          style="width: 100%;">
      </div>

      <button id="green-room-join-btn" class="green-room-join-btn" type="button">
        <span>🚀</span> Entrar na Sala
      </button>
    </div>
  </div>
