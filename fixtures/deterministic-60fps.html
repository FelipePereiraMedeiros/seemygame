<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Referência Determinística 60 FPS + Áudio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Consolas', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #canvas-60fps {
      width: 100vw;
      height: 100vh;
      max-width: 1920px;
      max-height: 1080px;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
    }
    #info-bar {
      margin-top: 10px;
      font-size: 16px;
      color: #00ffcc;
    }
  </style>
</head>
<body>
  <canvas id="canvas-60fps" width="1920" height="1080"></canvas>
  <div id="info-bar">FONTE DETERMINÍSTICA: 60.0 FPS REAL (1920x1080) | ÁUDIO 48kHz ATIVO</div>

  <script>
    const canvas = document.getElementById('canvas-60fps');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

    const TARGET_FPS = 60.0;
    const FRAME_DURATION_MS = 1000.0 / TARGET_FPS; // 16.666666666666668 ms

    let sessionStartTime = performance.now();
    let nextFrameTargetTime = sessionStartTime;
    let lastDrawTime = sessionStartTime;
    let drawnFrames = 0;
    let skippedTicks = 0;
    let missedDeadlines = 0;
    let slotsSlipped = 0;
    let maxDrawIntervalMs = 0;

    // Rastreamento separado para a fase steady
    let steadyTrackingActive = false;
    let steadyStartTime = 0;
    let steadyDrawnFrames = 0;
    let steadyMissedDeadlines = 0;
    let steadySlotsSlipped = 0;
    let steadyMaxDrawIntervalMs = 0;
    const steadyDrawIntervals = [];

    // Janela deslizante para medição de intervalos reais entre desenhos (últimos 120 frames)
    const drawIntervals = [];
    const frameTimestamps = [];

    function getSlidingWindowFps() {
      if (frameTimestamps.length < 2) return TARGET_FPS;
      const oldest = frameTimestamps[0];
      const newest = frameTimestamps[frameTimestamps.length - 1];
      const durationSec = (newest - oldest) / 1000.0;
      if (durationSec <= 0) return TARGET_FPS;
      return (frameTimestamps.length - 1) / durationSec;
    }

    function computeStatsForArray(arr) {
      if (!arr || arr.length < 2) return { count: arr?.length || 0, mean: 16.67, p50: 16.67, p95: 16.67, p99: 16.67, min: 16.67, max: 16.67, stdDev: 0 };
      const sorted = [...arr].sort((a, b) => a - b);
      const sum = sorted.reduce((a, b) => a + b, 0);
      const mean = sum / sorted.length;
      const p50 = sorted[Math.floor(sorted.length * 0.5)];
      const p95 = sorted[Math.floor(sorted.length * 0.95)];
      const p99 = sorted[Math.floor(sorted.length * 0.99)];
      const min = sorted[0];
      const max = sorted[sorted.length - 1];
      const variance = sorted.reduce((acc, v) => acc + Math.pow(v - mean, 2), 0) / sorted.length;
      const stdDev = Math.sqrt(variance);
      return {
        count: sorted.length,
        mean: Number(mean.toFixed(2)),
        p50: Number(p50.toFixed(2)),
        p95: Number(p95.toFixed(2)),
        p99: Number(p99.toFixed(2)),
        min: Number(min.toFixed(2)),
        max: Number(max.toFixed(2)),
        stdDev: Number(stdDev.toFixed(2))
      };
    }

    function getIntervalStats() {
      return computeStatsForArray(drawIntervals);
    }

    // WebAudio sintetizador contínuo
    let audioCtx = null;
    let osc = null;
    let gain = null;

    function startAudio() {
      if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
      osc = audioCtx.createOscillator();
      gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime); // Volume audível confortável
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
    }

    window.addEventListener('click', startAudio);
    window.addEventListener('keydown', startAudio);
    startAudio();

    // Loop com trava temporal estrita a 60.0 Hz e prevenção absoluta de rajadas (bursts)
    function render(now) {
      requestAnimationFrame(render);

      // Descarta tiques extras de monitores de alta taxa (120Hz, 144Hz, 165Hz ou 240Hz)
      // Tolerância de 1.0ms para alinhamento com o timer do rAF
      if (now < nextFrameTargetTime - 1.0) {
        skippedTicks++;
        return;
      }

      // Prevenção estrita de rajadas:
      // Se atrasar mais de um slot inteiro, registra deadline perdido e avança sem tentar
      // desenhar frames atrasados em rajada
      if (now >= nextFrameTargetTime + FRAME_DURATION_MS) {
        missedDeadlines++;
        const slipped = Math.floor((now - nextFrameTargetTime) / FRAME_DURATION_MS);
        slotsSlipped += slipped;
        if (steadyTrackingActive) {
          steadyMissedDeadlines++;
          steadySlotsSlipped += slipped;
        }
        nextFrameTargetTime = now + FRAME_DURATION_MS;
      } else {
        nextFrameTargetTime += FRAME_DURATION_MS;
      }

      drawnFrames++;
      const currentInterval = now - lastDrawTime;
      lastDrawTime = now;
      if (drawnFrames > 1) {
        drawIntervals.push(currentInterval);
        if (drawIntervals.length > 120) drawIntervals.shift();
        if (currentInterval > maxDrawIntervalMs) maxDrawIntervalMs = currentInterval;
      }

      if (steadyTrackingActive) {
        steadyDrawnFrames++;
        if (steadyDrawnFrames > 1) {
          steadyDrawIntervals.push(currentInterval);
          if (currentInterval > steadyMaxDrawIntervalMs) steadyMaxDrawIntervalMs = currentInterval;
        }
      }

      frameTimestamps.push(now);
      if (frameTimestamps.length > 60) frameTimestamps.shift();

      const currentFps = getSlidingWindowFps();
      const elapsedMs = now - sessionStartTime;
      const plannedFrames = Math.floor(elapsedMs / FRAME_DURATION_MS);
      const intervalStats = getIntervalStats();

      // Alterna tom a cada 500ms para verificação de modulação sonora contínua
      if (audioCtx && osc) {
        const tone = (Math.floor(elapsedMs / 500) % 2 === 0) ? 440 : 880;
        osc.frequency.setValueAtTime(tone, audioCtx.currentTime);
      }

      // 1. Fundo limpo
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 1920, 1080);

      // 2. Elemento móvel contínuo (bouncing/rotating box)
      const angle = (elapsedMs / 1000.0) * Math.PI * 2; // 1 rotação por segundo
      const cx = 960 + Math.sin(angle) * 550;
      const cy = 540 + Math.cos(angle * 1.5) * 280;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle * 2);
      ctx.fillStyle = `hsl(${(drawnFrames * 3) % 360}, 90%, 55%)`;
      ctx.fillRect(-90, -90, 180, 180);
      ctx.restore();

      // 3. Círculo central pulsante
      ctx.beginPath();
      ctx.arc(960, 540, 120 + Math.sin(elapsedMs / 200.0) * 30, 0, Math.PI * 2);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 8;
      ctx.stroke();

      // 4. Marcador óptico no topo para auditoria visual de fluidez
      const barX = (drawnFrames * 16) % 1800;
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(barX, 30, 120, 30);

      // 5. Textos de auditoria em alta visibilidade e resolução nativa 1080p
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 44px monospace';
      ctx.fillText(`FRAME: ${String(drawnFrames).padStart(6, '0')} (Planejado pelo Relógio: ${plannedFrames})`, 80, 140);
      ctx.fillText(`TEMPO REAL: ${elapsedMs.toFixed(1)} ms`, 80, 200);
      ctx.fillText(`CADÊNCIA: ${currentFps.toFixed(2)} FPS | INTERVALO MÉDIO: ${intervalStats.mean.toFixed(2)} ms`, 80, 260);

      ctx.font = '28px monospace';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`FONTE: REFERÊNCIA DETERMINÍSTICA NATIVA (1920x1080 @ 60.0Hz)`, 80, 920);
      ctx.fillText(`ESPACAMENTO: p95=${intervalStats.p95}ms | p99=${intervalStats.p99}ms | max=${intervalStats.max}ms | stdDev=${intervalStats.stdDev}ms`, 80, 960);
      ctx.fillText(`ÁUDIO: 48 kHz ESTÉREO (SINE 440Hz / 880Hz ALTERNADO)`, 80, 1000);
      ctx.fillText(`SLOTS: TICKS DESCARTADOS=${skippedTicks} | DEADLINES PERDIDOS=${missedDeadlines} (SLOTS SLIPPED=${slotsSlipped})`, 80, 1040);
    }

    requestAnimationFrame(render);

    // Expõe API para automação Playwright rigorosa
    window.__deterministicSource = {
      reset: () => {
        sessionStartTime = performance.now();
        nextFrameTargetTime = sessionStartTime;
        lastDrawTime = sessionStartTime;
        drawnFrames = 0;
        skippedTicks = 0;
        missedDeadlines = 0;
        slotsSlipped = 0;
        maxDrawIntervalMs = 0;
        steadyTrackingActive = false;
        steadyStartTime = 0;
        steadyDrawnFrames = 0;
        steadyMissedDeadlines = 0;
        steadySlotsSlipped = 0;
        steadyMaxDrawIntervalMs = 0;
        steadyDrawIntervals.length = 0;
        drawIntervals.length = 0;
        frameTimestamps.length = 0;
        if (audioCtx && osc) {
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        }
      },
      startSteadyTracking: () => {
        steadyTrackingActive = true;
        steadyStartTime = performance.now();
        steadyDrawnFrames = 0;
        steadyMissedDeadlines = 0;
        steadySlotsSlipped = 0;
        steadyMaxDrawIntervalMs = 0;
        steadyDrawIntervals.length = 0;
        return true;
      },
      getState: () => {
        const now = performance.now();
        const elapsed = now - sessionStartTime;
        const fps = getSlidingWindowFps();
        const plannedFrames = Math.floor(elapsed / FRAME_DURATION_MS);
        const rect = canvas.getBoundingClientRect();
        return {
          drawnFrames,
          plannedFrames,
          skippedTicks,
          missedDeadlines,
          slotsSlipped,
          maxDrawIntervalMs: Number(maxDrawIntervalMs.toFixed(2)),
          intervalStats: getIntervalStats(),
          steadyStats: {
            active: steadyTrackingActive,
            drawnFrames: steadyDrawnFrames,
            missedDeadlines: steadyMissedDeadlines,
            slotsSlipped: steadySlotsSlipped,
            maxDrawIntervalMs: Number(steadyMaxDrawIntervalMs.toFixed(2)),
            intervalStats: computeStatsForArray(steadyDrawIntervals)
          },
          fps: Number(fps.toFixed(2)),
          elapsedMs: Number(elapsed.toFixed(1)),
          currentTime: Number((elapsed / 1000.0).toFixed(2)),
          audioActive: audioCtx?.state === 'running',
          nativeWidth: 1920,
          nativeHeight: 1080,
          actualCanvasWidth: Math.round(rect.width),
          actualCanvasHeight: Math.round(rect.height),
          windowInnerWidth: window.innerWidth,
          windowInnerHeight: window.innerHeight,
          devicePixelRatio: window.devicePixelRatio,
          paused: false,
          readyState: 4,
          playerState: 1,
          hasError: false,
          isReady: drawnFrames >= 30 && fps >= 58.0 && fps <= 62.0
        };
      },
      startAudio,
      setMuted: (muted) => {
        if (!gain || !audioCtx) return;
        gain.gain.setValueAtTime(muted ? 0 : 0.15, audioCtx.currentTime);
      },
      setVolume: (v) => {
        if (!gain || !audioCtx) return;
        gain.gain.setValueAtTime(v * 0.15, audioCtx.currentTime);
      }
    };
  </script>
</body>
</html>
