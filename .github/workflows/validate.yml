name: Validate modular architecture
on:
  pull_request:
  push:
    branches: [dev, alfa, main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:sessions
        env:
          SEEMYGAME_BROWSER_CHANNEL: chromium
      - run: npm run test:e2e:whiteboard
        env:
          SEEMYGAME_BROWSER_CHANNEL: chromium
