[package]
name = "seemygame"
version = "1.0.0"
description = "SeeMyGame - Ultra Smooth Gaming Stream Desktop"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.83"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["wry", "devtools"] }
tauri-plugin-log = "2"
gstreamer = "0.25.2"
gstreamer-webrtc = "0.25.2"
gstreamer-video = "0.25.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_UI_HiDpi",
] }

[target.'cfg(windows)'.dependencies]
vigem-client = "0.1"
